name: 列出用户所有公开仓库(纯文本清单)

# 说明:
# 拉取 SYNC_USERNAME 指定账户下的全部公开(public)仓库,
# 一行一个,生成纯文本清单文件,提交到本仓库(.yml 所在仓库)根目录。
# 不做任何白名单/排除名单过滤,不 clone 任何仓库,只列名单。

on:
  # schedule:
  #   # 每天 UTC 19:00(北京时间次日 3:00)自动执行,可自行调整 cron 表达式
  #   - cron: '0 19 * * *'
  workflow_dispatch:
    # 允许在 Actions 页面手动点 "Run workflow" 触发

permissions:
  contents: write

concurrency:
  group: list-public-repos-${{ github.repository }}
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ══════════════════════════════════════════════════════════════════
    # ██████████████████  ★★★ 需要你手动配置 ★★★  ██████████████████
    # ══════════════════════════════════════════════════════════════════
    env:
      # ---- 要列出公开仓库的 GitHub 账户名 ----
      SYNC_USERNAME: "timeflysoon"

      # ---- 生成的清单文件名(相对本仓库根目录) ----
      OUTPUT_FILE: "public_repos.txt"
    # ══════════════════════════════════════════════════════════════════
    # ██████████████████  ★★★ 配置区到此结束 ★★★  ██████████████████
    # ══════════════════════════════════════════════════════════════════

    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 jq(用于稳定解析 GitHub API 返回的 JSON)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 拉取远程公开仓库列表,写入文本文件
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          USERNAME="$SYNC_USERNAME"
          if [ -z "$USERNAME" ] || [ "$USERNAME" = "你的GitHub用户名" ]; then
            echo "错误: 请先在 yml 顶部 env.SYNC_USERNAME 填写真实用户名"
            exit 1
          fi

          REMOTE_LIST_FILE=$(mktemp)
          PAGE=1
          while true; do
            RESPONSE=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_API_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${PAGE}&type=public")

            PAGE_COUNT=$(echo "$RESPONSE" | jq 'length')
            [ "$PAGE_COUNT" -eq 0 ] && break

            echo "$RESPONSE" | jq -r '.[] | .full_name' >> "$REMOTE_LIST_FILE"

            PAGE=$((PAGE + 1))
          done

          sort -u "$REMOTE_LIST_FILE" -o "$REMOTE_LIST_FILE"

          REMOTE_COUNT=$(wc -l < "$REMOTE_LIST_FILE" | tr -d ' ')
          echo "远程共发现 $REMOTE_COUNT 个公开仓库"

          if [ "$REMOTE_COUNT" -eq 0 ]; then
            echo "未获取到任何仓库,请检查 SYNC_USERNAME 是否正确、该账户下是否有公开仓库"
            exit 1
          fi

          mv "$REMOTE_LIST_FILE" "./$OUTPUT_FILE"
          echo "已写入 $OUTPUT_FILE,共 $REMOTE_COUNT 行"

      - name: 提交清单文件
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f "./$OUTPUT_FILE"

          if git diff --staged --quiet; then
            echo "没有变化,无需提交"
            exit 0
          fi

          git commit -m "更新公开仓库清单 $(date -u '+%Y-%m-%d %H:%M UTC')"

          git pull --rebase
          git push
